<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#c89f48" />
      <stop offset="100%" stop-color="#8a631c" />
    </linearGradient>

    <!-- Dark Background Radial -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142136" />
      <stop offset="100%" stop-color="#08111f" />
    </radialGradient>
  </defs>

  <!-- Base Circle -->
  <circle cx="120" cy="120" r="114" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="120" cy="120" r="105" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Beaded Crown (Ade Olubadan) Top Accent -->
  <g transform="translate(120, 62) scale(0.8)">
    <path d="M-30,20 L-25,-15 L-10,0 L0,-30 L10,0 L25,-15 L30,20 Z" fill="url(#goldGrad)" />
    <!-- Crown Jewels / Beads -->
    <circle cx="0" cy="-30" r="4" fill="#ffffff" />
    <circle cx="-25" cy="-15" r="3.5" fill="#ffffff" />
    <circle cx="25" cy="-15" r="3.5" fill="#ffffff" />
    <!-- Crown Base Band -->
    <rect x="-32" y="20" width="64" height="6" rx="2" fill="url(#goldGrad)" />
  </g>

  <!-- Mapo Hall Columns Silhouette Motif -->
  <g transform="translate(120, 125)" opacity="0.9">
    <!-- Pediment -->
    <polygon points="-45,-15 0,-32 45,-15" fill="url(#goldGrad)" />
    <rect x="-45" y="-14" width="90" height="4" fill="url(#goldGrad)" />
    
    <!-- 4 Pillars -->
    <rect x="-38" y="-8" width="8" height="38" rx="1" fill="url(#goldGrad)" />
    <rect x="-16" y="-8" width="8" height="38" rx="1" fill="url(#goldGrad)" />
    <rect x="8" y="-8" width="8" height="38" rx="1" fill="url(#goldGrad)" />
    <rect x="30" y="-8" width="8" height="38" rx="1" fill="url(#goldGrad)" />

    <!-- Base Steps -->
    <rect x="-45" y="30" width="90" height="5" fill="url(#goldGrad)" />
    <rect x="-50" y="35" width="100" height="5" fill="url(#goldGrad)" />
  </g>

  <!-- Royal Beaded Necklace Arc (Ilẹ̀kẹ̀) -->
  <path d="M 50,140 Q 120,200 190,140" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6" />

  <!-- Circular Text Outer Arch -->
  <path id="textArcTop" d="M 30,120 A 90,90 0 1,1 210,120" fill="none" />
  <text font-family="serif" font-size="10.5" font-weight="bold" fill="url(#goldGrad)" letter-spacing="2.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      ASSOCIATION OF MOGAJIS
    </textPath>
  </text>

  <!-- Circular Text Bottom Arch -->
  <path id="textArcBottom" d="M 210,120 A 90,90 0 0,1 30,120" fill="none" />
  <text font-family="serif" font-size="10" font-weight="bold" fill="#d4b56e" letter-spacing="2.2">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      IBADANLAND · EST. 1829
    </textPath>
  </text>

  <!-- Diamond Star Accents -->
  <polygon points="26,120 30,117 34,120 30,123" fill="url(#goldGrad)" />
  <polygon points="206,120 210,117 214,120 210,123" fill="url(#goldGrad)" />
</svg>
